<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Notas Musicais</title>

<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">

<!-- Tema aplicado ANTES do CSS: sem isto a tela pisca ao abrir.
     data-tema="escuro" = Aurora Violeta · data-tema="claro" = Café Âmbar -->
<script>try{document.documentElement.setAttribute("data-tema",localStorage.getItem("app_tema")||"escuro")}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=60">

<script>
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // Forçar checagem de atualização
      reg.update();
    }).catch(()=>{});
    // Quando um novo SW toma controle, recarregar para pegar tudo fresco
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
  });
}
</script>
</head>
<body>

<!-- ====================== GATE: LOGIN ====================== -->
<div class="gate on" id="gate">
  <div class="in">
    <h1>Notas <em>Musicais</em></h1>
    <p>Acordes, inversões e repertório na ponta dos dedos.</p>
    <div id="gateLoad"><div class="spin"></div></div>
    <div id="gateBtn" style="display:none">
      <button class="btn g" id="btnLogin">
        <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.7-.4-4H24v7.3h12.1c-.2 2-1.6 5-4.5 7l-.1.3 6.5 5 .5.1c4.1-3.8 6.6-9.4 6.6-15.7"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.4c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.1l-.3.1-6.7 5.2-.1.3C7.9 41 15.4 46 24 46"/><path fill="#FBBC05" d="M11.5 28.4c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4v-.3l-6.8-5.3-.2.1C2.9 17.1 2 20.4 2 24s.9 6.9 2.5 9.9z"/><path fill="#EB4335" d="M24 10.2c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.1 29.9 2 24 2 15.4 2 7.9 7 4.5 14.1l7 5.5c1.8-5.3 6.7-9.4 12.5-9.4"/></svg>
        Entrar com Google
      </button>
      <div class="sub" id="offMsg" style="display:none"></div>
    </div>
  </div>
</div>

<!-- ====================== GATE: AGUARDANDO LIBERAÇÃO ====================== -->
<div class="gate" id="espera">
  <div class="in">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--warn);margin-bottom:16px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <h1 id="espTit">Aguardando liberação</h1>
    <p id="espTxt"></p>
    <div class="panel">
      <h4>Pedido enviado por</h4>
      <div style="font-size:var(--fs-2)" id="espMail"></div>
    </div>
    <button class="btn" id="espRecarregar">Já fui liberado</button>
    <button class="btn d" id="espSair">Entrar com outra conta</button>
  </div>
</div>

<!-- ====================== APP ====================== -->
<div class="app" id="app" style="display:none">

  <header class="top">
    <div class="top-row">
      <div class="brand">Notas <em>Musicais</em><small id="ctxLabel">Dicionário</small></div>
      <div class="topAcoes">
        <button class="temaBtn" id="btnTema" aria-label="Mudar tema">
          <svg class="ico-sol" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
          <svg class="ico-lua" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a6.8 6.8 0 0 0 10.8 10.8z"/></svg>
        </button>
        <img class="avatar" id="avatar" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
      </div>
    </div>
  </header>

  <!-- ===== TELA 1 — DICIONÁRIO ===== -->
  <main class="screen active" id="scr-inicio">
    <div class="search-wrap">
      <div class="card search-card">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <input id="q" type="search" placeholder="Digite um acorde (ex: C, F#m7)..." autocomplete="off">
        <button id="qLimpa" aria-label="Limpar" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="autocomplete-results" class="autocomplete-list"></div>
    </div>
    <div id="debug-notas" class="debug-notas"></div>

    <div id="teclado-container">
      <div id="teclado" class="teclado"></div>
    </div>

    <div class="chips center" id="chips-inversao" style="margin-top:24px">
      <button class="on" data-inv="0">Fundamental</button>
      <button data-inv="1">1ª Inversão</button>
      <button data-inv="2">2ª Inversão</button>
      <button data-inv="3" id="btn-inv-3" style="display:none">3ª Inversão</button>
    </div>

    <div class="acoes-dicionario" id="acoesDicionario">
      <button class="btn" id="btnPlayBloco" style="display:none" title="Tocar Bloco">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
      <button class="btn" id="btnPlayArpejo" style="display:none" title="Arpejar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5v14M7 5v14M22 8v8M2 8v8"/></svg>
      </button>
      <button class="btn p" id="btnFavoritarAcorde" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Favoritar
      </button>
      <button class="btn" id="btnSalvarAcordeDicionario" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        Música
      </button>
    </div>
  </main>

  <!-- ===== TELA 2 — REPERTÓRIO ===== -->
  <main class="screen" id="scr-meus">

    <div class="seg" id="segRepertorio" style="margin-bottom:16px">
      <button class="on" data-tab="musicas">Setlists</button>
      <button data-tab="favoritos">Favoritos</button>
    </div>

    <div class="cabecalho-lista" id="cabecalhoRepertorio">
      <h2>Minhas Músicas</h2>
      <button class="btn p compact" id="btnNovaMusica" data-scr="nova-musica">+ Nova</button>
    </div>

    <div class="seg" id="segMusica" style="display:none;margin-bottom:16px">
      <button class="on" data-vis="lista">Opção 1 (Lista)</button>
      <button data-vis="cheia">Opção 3 (Chips)</button>
    </div>

    <div id="listaMusicas"></div>
    <div id="listaFavoritos" style="display:none"></div>

    <div id="visaoMusicaHeader" style="display:none"></div>
    <div id="visaoMusica" style="display:none"></div>
  </main>

  <!-- ===== TELA CONSTRUTOR DE MÚSICA ===== -->
  <main class="screen" id="scr-nova-musica">
    <div class="construtor-topo">
      <button class="btn btn-icone" id="btnVoltarRepertorio" aria-label="Voltar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <input type="text" id="inputNomeMusica" class="input-titulo" placeholder="Nome da Música...">
    </div>

    <div id="containerSecoesMusica" class="secoes-musica">
      <!-- Seções geradas dinamicamente aqui -->
    </div>

    <div class="barra-construtor">
      <button class="btn" id="btnAdicionarSecao">+ Adicionar Seção</button>
      <button class="btn p" id="btnSalvarMusica">Salvar Música</button>
    </div>
  </main>

  <!-- ===== TELA 3 — PERFIL ===== -->
  <main class="screen" id="scr-perfil">
    <div class="panel">
      <h4>Conta</h4>
      <div style="display:flex;align-items:center;gap:11px">
        <img class="avatar" id="pAvatar" alt="" style="width:44px;height:44px">
        <div><b id="pNome">—</b><div class="sub" style="margin:0" id="pMail">—</div></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:9px" id="pRoles"></div>
    </div>

    <!-- só admin -->
    <div class="panel" id="painelAcesso" style="display:none">
      <h4>Acessos <em class="role" id="pendBadge" style="display:none">0</em></h4>
      <div class="sub" style="margin:0 0 10px" id="acPlacar">—</div>
      <button class="btn" id="btnAcessos"><span id="btnAcessosTxt">Gerenciar acessos</span></button>
    </div>

    <div class="panel">
      <h4>Sessão</h4>
      <button class="btn d" id="btnLogout">Sair</button>
      <div class="sub" id="syncMsg">—</div>
    </div>
  </main>

  <!-- ===== SUB-TELA — gerenciar acessos (só admin) ===== -->
  <main class="screen" id="scr-acessos">
    <button class="voltar" id="acVoltar">‹ Perfil</button>
    <div class="busca">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/></svg>
      <input id="q-ac" type="search" placeholder="Buscar por nome ou e-mail" autocomplete="off">
    </div>
    <div class="seg" id="segAc">
      <button class="on" data-st="pendente">Pedidos <em id="cPend">0</em></button>
      <button data-st="aprovado">Liberados <em id="cLib">0</em></button>
      <button data-st="negado">Negados <em id="cNeg">0</em></button>
    </div>
    <div id="listaAc"></div>
    <div class="loteBar" id="loteBar" style="display:none">
      <span class="n" id="loteN">0 selecionados</span>
      <div id="loteAcoes"></div>
    </div>
  </main>

  <!-- ===== TELA 4 — RELATÓRIO HARMÔNICO ===== -->
  <main class="screen" id="scr-relatorio" style="display:none; padding-bottom: 80px; overflow-y: auto;">
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:16px;">
      <button class="btn btn-icone" id="btnVoltarRelatorio" aria-label="Voltar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h2 style="margin:0; font-size:22px; color:var(--text);">💡 Relatório Harmônico</h2>
    </div>
    <div id="conteudoRelatorioHarmonico" style="display:flex; flex-direction:column; gap:24px;">
      <!-- Eventos gerados via JS entram aqui -->
    </div>
  </main>

  <!-- ===== TELA 5 — COMO TOCAR ===== -->
  <main class="screen" id="scr-comotocar" style="display:none; padding-bottom: 80px; overflow-y: auto; background:#0e0b0a; color:#f7efe2;">
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px; border-bottom:1px solid rgba(255,255,255,0.07); padding:14px 22px;">
      <button class="btn btn-icone" id="btnVoltarComoTocar" aria-label="Voltar" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,213,79,0.18); color:#f7efe2;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
    </div>
    <div id="conteudoComoTocar" style="display:flex; flex-direction:column;">
      <!-- Eventos gerados via JS entram aqui -->
    </div>
  </main>

  <!-- ===== NAVEGAÇÃO INFERIOR (pill flutuante) ===== -->
  <nav class="nav" id="nav" role="tablist">
    <button class="on" data-scr="inicio" role="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/></svg>
      Dicionário
    </button>
    <button data-scr="meus" role="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      Repertório
      <em class="badge" id="navBadge" style="display:none">0</em>
    </button>
    <button data-scr="perfil" role="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Perfil
      <em class="badge red pulsa" id="navBadgePerfil" style="display:none">0</em>
    </button>
  </nav>
</div>

<!-- ====================== JANELAS DE BAIXO ====================== -->
<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTit">
  <div class="grip"></div>
  <h3 id="shTit"></h3>
  <p class="desc" id="shDesc"></p>
  <div id="shCorpo"></div>
  <button class="btn p" id="shBtn" style="margin-top:14px">Ação principal</button>
</section>

<section class="sheet" id="opSheet" role="dialog" aria-modal="true" aria-labelledby="opTit">
  <div class="grip"></div>
  <h3 id="opTit">Opções</h3>
  <div id="opLista"></div>
</section>

<div class="toast" id="toast"></div>

<script src="data.js?v=60"></script>
<script type="module" src="app.js?v=60"></script>
</body>
</html>
