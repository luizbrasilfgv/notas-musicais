# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
concurrency:
  group: deploy-hosting
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Conferir sintaxe do app.js
        run: node --check public/app.js

      - name: Conferir se o CSS está balanceado
        run: |
          node -e "
            const fs = require('fs');
            const css = fs.readFileSync('public/styles.css','utf8').replace(/\/\*[\s\S]*?\*\//g,'');
            let d = 0;
            for (const c of css) { if (c === '{') d++; else if (c === '}') d--; }
            if (d !== 0) { console.error('CSS desbalanceado: saldo ' + d); process.exit(1); }
            console.log('CSS ok');
          "

      - name: Carimbar versão de cache
        run: node scripts/stamp-versao.mjs "${{ github.run_number }}-${GITHUB_SHA::7}"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOTAS_MUSICAIS_A2AD8 }}
          channelId: live
          projectId: notas-musicais-a2ad8
          target: main
